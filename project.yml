name: GIFrecorder
options:
  bundleIdPrefix: com.lasakondrej
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Swift 6 / Xcode 16 defaults to 'complete' strict concurrency checking.
    # 'targeted' checks only declarations that adopt Sendable/async — appropriate
    # for a Swift 5.9 codebase that already handles concurrency explicitly.
    SWIFT_STRICT_CONCURRENCY: targeted

schemes:
  GIFrecorder:
    build:
      targets:
        GIFrecorder: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: GIFrecorderTests
          parallelizable: true
        - name: GIFrecorderUITests
    profile:
      config: Release
    archive:
      config: Release

targets:
  GIFrecorder:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GIFrecorder
        excludes:
          - "**/*.md"
    resources:
      - path: GIFrecorder/Resources/Assets.xcassets
      - path: GIFrecorder/Resources/Tools/gifski
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lasakondrej.gifrecorder
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: arm64
        VALID_ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: GIFrecorder/Resources/GIFrecorder.entitlements
        INFOPLIST_FILE: GIFrecorder/Resources/Info.plist
        PRODUCT_NAME: GIFrecorder
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Manual signing avoids xcodebuild's default search for "Mac Development" (old
        # cert name). The cert in keychain is "Apple Development" — identical in all
        # capability terms but Automatic mode doesn't find it on this machine.
        CODE_SIGN_STYLE: Manual
        # OU field in the cert is R9QY8Q23A2 — Xcode matches DEVELOPMENT_TEAM against OU, not the
        # team ID shown in the CN display name (C3URWP759G). These must agree or xcodebuild errors.
        DEVELOPMENT_TEAM: R9QY8Q23A2
        CODE_SIGN_IDENTITY: "Apple Development: jimicze@gmail.com (C3URWP759G)"
        # Manual mode does not require a provisioning profile for a non-sandboxed
        # Mac app distributed outside the App Store.
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Xcode 16 sandboxes build scripts by default; the post-build copy script
        # needs to read/delete files outside the build directory (build/$CONFIGURATION/).
        # Disabling sandboxing restores the pre-Xcode-16 behaviour for this target only.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: GIFrecorder/Resources/Info.plist
    entitlements:
      path: GIFrecorder/Resources/GIFrecorder.entitlements
    postBuildScripts:
      - name: "Export .app to project build folder"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          DEST="$PROJECT_DIR/build/$CONFIGURATION"
          mkdir -p "$DEST"
          rm -rf "$DEST/$FULL_PRODUCT_NAME"
          # ditto preserves symlinks and resource forks but may not preserve the
          # code signature in all Xcode/macOS versions. Re-sign explicitly below.
          ditto "$BUILT_PRODUCTS_DIR/$FULL_PRODUCT_NAME" "$DEST/$FULL_PRODUCT_NAME"
          # Embed bundled binary — gifski is not picked up by Copy Bundle Resources
          # for extensionless binaries in xcodegen, so we inject it manually here.
          GIFSKI_SRC="$PROJECT_DIR/GIFrecorder/Resources/Tools/gifski"
          if [ -f "$GIFSKI_SRC" ]; then
            cp "$GIFSKI_SRC" "$DEST/$FULL_PRODUCT_NAME/Contents/Resources/gifski"
            chmod +x "$DEST/$FULL_PRODUCT_NAME/Contents/Resources/gifski"
          fi
          # Re-sign using the same identity Xcode used (real Developer cert in Release,
          # ad-hoc in Debug). This preserves TCC-compatible signatures on macOS 15.
          SIGN_ID="${CODE_SIGN_IDENTITY:-Apple Development: jimicze@gmail.com (C3URWP759G)}"
          if [ -z "$(find "$DEST/$FULL_PRODUCT_NAME/Contents/PlugIns" -name "*.xctest" 2>/dev/null | head -1)" ]; then
            /usr/bin/codesign --force --deep --sign "$SIGN_ID" "$DEST/$FULL_PRODUCT_NAME"
          else
            echo "Skipping deep codesign — xctest plugins embedded (test build)"
          fi
          echo "Exported and signed $FULL_PRODUCT_NAME → build/$CONFIGURATION/$FULL_PRODUCT_NAME"
        showEnvVarsInLog: false

  GIFrecorderTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GIFrecorderTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lasakondrej.gifrecorder.tests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        # Must match the app target's signing to satisfy Team ID check when the
        # test bundle is loaded into the app host process.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: R9QY8Q23A2
        CODE_SIGN_IDENTITY: "Apple Development: jimicze@gmail.com (C3URWP759G)"
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: GIFrecorder

  GIFrecorderUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: GIFrecorderUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lasakondrej.gifrecorder.uitests
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: arm64
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: R9QY8Q23A2
        CODE_SIGN_IDENTITY: "Apple Development: jimicze@gmail.com (C3URWP759G)"
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - target: GIFrecorder
