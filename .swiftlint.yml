disabled_rules:
  - trailing_whitespace
  - line_length

opt_in_rules:
  - empty_count
  - missing_docs

excluded:
  - GIFrecorder.xcodeproj
  - DerivedData
  - .build
  - Pods

line_length:
  warning: 120
  error: 200

type_body_length:
  warning: 300
  error: 500

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - x
    - y
    - w
    - h
    - dx
    - dy
    - db
    - fps
    - url
    - pts
